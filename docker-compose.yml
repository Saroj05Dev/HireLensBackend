version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hirelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirelens
      POSTGRES_PASSWORD: hirelens
      POSTGRES_DB: hirelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirelens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirelens-backend
    ports:
      - "3500:3500"
    env_file:
      - ./.env
    environment:
      # These override the .env file values to use Docker internal hostnames
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://hirelens:hirelens@postgres:5432/hirelens
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3500/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../hire-lens-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3500
    container_name: hirelens-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
